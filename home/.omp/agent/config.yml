# OMP agent tuning: compaction, native judge, task LSP, and recap.
# cfg-tools-omp.sh applies every key below; record values (modelRoles,
# fallbackChains, modelThresholds) merge into existing user entries.
setupVersion: 2
advisor:
  maxNotesPerUpdate: 1
compaction:
  thresholdPercent: 80
  # 1M-window Claude families: compact at 80% of a 375k base (300k), not 800k.
  # Bases at or below a model's standard window never opt into extended windows.
  modelThresholds:
    anthropic/claude-opus-5*: 375000
    anthropic/claude-sonnet-5*: 375000
    anthropic/claude-fable-5*: 375000
    anthropic/claude-mythos-5*: 375000
  idleEnabled: true
  idleTimeoutSeconds: 600
  v2RetainedMessageBudget: 32000
display:
  showTokenUsage: true
  cacheMissMarker: true
snapcompact:
  # Upstream default; explicit to turn off earlier cfg-init installs.
  toolResults: false
task:
  enableLsp: true
  maxRecursionDepth: 1
recap:
  idleSeconds: 600
modelRoles:
  judge: typesafe/jev-latest
retry:
  fallbackChains:
    judge:
      - opencode-zen-jev/jev-1.13

name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in install.sh lib/*.sh components/*.sh home/.local/bin/tg-notify; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile lib/cfg.py home/.local/share/cfg-init-feedback/*.py home/.agents/skills/dissatisfaction/*.py
      - name: Installer CLI
        run: |
          ./install.sh list
          if ./install.sh </dev/null; then echo "non-tty run without --yes must fail" >&2; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model gate JavaScript
        run: node --check home/.local/share/model-gate/model-gate-proxy.mjs
      - name: Feedback tests
        working-directory: home/.agents/skills/dissatisfaction
        run: python3 -m unittest -v test_feedback.py
      - name: T3 policy tests
        working-directory: home/.local/share/cfg-init-feedback
        run: python3 -m unittest -v test_t3_policy.py
      - name: No committed secrets
        run: |
          if git grep -nE 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|hf_[A-Za-z0-9]{20,}' -- .; then
            echo "Potential credential material found" >&2; exit 1
          fi
